<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Veridial — Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="profileSetting.css" />
  </head>
  <body>
    <div class="device-frame">
      <div class="screen" id="screen">
        <!-- mock Android status bar -->
        <div class="status-bar" aria-hidden="true">
          <span class="status-bar__time">9:41</span>
          <div class="status-bar__icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path
                d="M8 2.4c2.3 0 4.4.9 6 2.4l-1.4 1.5A6.6 6.6 0 0 0 8 4.6a6.6 6.6 0 0 0-4.6 1.7L2 4.8A8.6 8.6 0 0 1 8 2.4Zm0 3.4c1.3 0 2.5.5 3.4 1.4l-1.4 1.4A2.9 2.9 0 0 0 8 7.8c-.8 0-1.5.3-2 .8L4.6 7.2A4.6 4.6 0 0 1 8 5.8Zm0 3.3c.6 0 1.1.2 1.5.6L8 11.2 6.5 9.7c.4-.4.9-.6 1.5-.6Z"
                fill="currentColor"
              />
            </svg>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
              <rect
                x="1"
                y="1"
                width="14"
                height="10"
                rx="2"
                stroke="currentColor"
                stroke-width="1.1"
              />
              <rect
                x="2.3"
                y="2.3"
                width="9.4"
                height="7.4"
                rx="1"
                fill="currentColor"
              />
              <rect
                x="16"
                y="4"
                width="1.6"
                height="4"
                rx="0.6"
                fill="currentColor"
              />
            </svg>
          </div>
        </div>

        <!-- scrollable content -->
        <main class="content">
          <header class="app-bar app-bar--plain">
            <h1 class="app-bar__title app-bar__title--left">Profile</h1>
          </header>

          <!-- Profile header -->
          <section class="profile-head">
            <div class="profile-avatar">AR</div>
            <h2 class="profile-name">Alex</h2>
            <p class="profile-email">alex@example.com</p>
            <button type="button" class="btn btn--ghost btn--pill">
              Edit Profile
            </button>
          </section>

          <!-- Account -->
          <section class="settings-group">
            <p class="settings-group__label">Account</p>
            <div class="settings-card">
              <button type="button" class="settings-row">
                <span class="settings-row__icon settings-row__icon--indigo">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle
                      cx="9"
                      cy="6.2"
                      r="2.8"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <path
                      d="M3.6 15c.8-2.9 2.9-4.5 5.4-4.5s4.6 1.6 5.4 4.5"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
                <span class="settings-row__label">Profile</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button type="button" class="settings-row">
                <span class="settings-row__icon settings-row__icon--violet">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <rect
                      x="4.5"
                      y="8"
                      width="9"
                      height="6.5"
                      rx="1.6"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <path
                      d="M6.5 8V6a2.5 2.5 0 0 1 5 0v2"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                  </svg>
                </span>
                <span class="settings-row__label">Privacy</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button type="button" class="settings-row">
                <span class="settings-row__icon settings-row__icon--amber">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path
                      d="M9 3c-2.5 0-4.5 1.9-4.5 4.2v2.4l-1.1 2.1c-.3.5.1 1.1.6 1.1h10c.5 0 .9-.6.6-1.1l-1.1-2.1V7.2C13.5 4.9 11.5 3 9 3Z"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                <span class="settings-row__label">Notifications</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button type="button" class="settings-row settings-row--last">
                <span class="settings-row__icon settings-row__icon--green">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <path
                      d="M9 2.3 3.6 4.4v3.9c0 3.5 2.3 6.3 5.4 7.2 3.1-.9 5.4-3.7 5.4-7.2V4.4L9 2.3Z"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                <span class="settings-row__label">Security</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </section>

          <!-- Preferences -->
          <section class="settings-group">
            <p class="settings-group__label">Preferences</p>
            <div class="settings-card">
              <button type="button" class="settings-row">
                <span class="settings-row__icon settings-row__icon--indigo">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle
                      cx="9"
                      cy="9"
                      r="3.4"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <path
                      d="M9 2.5v1.6M9 13.9v1.6M15.5 9h-1.6M4.1 9H2.5M13.4 4.6l-1.1 1.1M5.7 12.3l-1.1 1.1M13.4 13.4l-1.1-1.1M5.7 5.7 4.6 4.6"
                      stroke="currentColor"
                      stroke-width="1.3"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
                <span class="settings-row__label">Theme</span>
                <span class="settings-row__value">Light</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button type="button" class="settings-row settings-row--last">
                <span class="settings-row__icon settings-row__icon--violet">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle
                      cx="9"
                      cy="9"
                      r="6.8"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <path
                      d="M2.2 9h13.6M9 2.2c1.7 1.9 2.6 4.4 2.6 6.8s-.9 4.9-2.6 6.8c-1.7-1.9-2.6-4.4-2.6-6.8S7.3 4.1 9 2.2Z"
                      stroke="currentColor"
                      stroke-width="1.2"
                    />
                  </svg>
                </span>
                <span class="settings-row__label">Language</span>
                <span class="settings-row__value">English</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </section>

          <!-- Support -->
          <section class="settings-group">
            <p class="settings-group__label">Support</p>
            <div class="settings-card">
              <button type="button" class="settings-row">
                <span class="settings-row__icon settings-row__icon--amber">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle
                      cx="9"
                      cy="9"
                      r="7"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <path
                      d="M7 7c0-1.2 1-2 2-2s2 .7 2 1.8c0 1.2-2 1.3-2 3"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linecap="round"
                    />
                    <circle cx="9" cy="12.6" r="0.9" fill="currentColor" />
                  </svg>
                </span>
                <span class="settings-row__label">Help Center</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
              <button type="button" class="settings-row settings-row--last">
                <span class="settings-row__icon settings-row__icon--indigo">
                  <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                    <circle
                      cx="9"
                      cy="9"
                      r="7"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                    <path
                      d="M9 8.2v4.4M9 5.8v.01"
                      stroke="currentColor"
                      stroke-width="1.6"
                      stroke-linecap="round"
                    />
                  </svg>
                </span>
                <span class="settings-row__label">About</span>
                <svg
                  class="chevron"
                  width="16"
                  height="16"
                  viewBox="0 0 16 16"
                  fill="none"
                >
                  <path
                    d="m6 3.5 5 4.5-5 4.5"
                    stroke="currentColor"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </button>
            </div>
          </section>

          <button type="button" class="logout-btn">
            <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
              <path
                d="M6.5 15H4a1.5 1.5 0 0 1-1.5-1.5v-9A1.5 1.5 0 0 1 4 3h2.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M11 12l3.5-3.5L11 5M14.3 8.5H6.5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            Log Out
          </button>

          <p class="app-version">Veridial v1.0.0</p>

          <div class="content-spacer"></div>
        </main>

        <!-- Bottom navigation -->
        <nav class="bottom-nav" aria-label="Primary">
          <button type="button" class="bottom-nav__item" data-tab="home">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <path
                d="M4 10.2 11 4l7 6.2v6.8a1 1 0 0 1-1 1h-3.4v-4.8H8.4V18H5a1 1 0 0 1-1-1v-6.8Z"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linejoin="round"
              />
            </svg>
            <span>Home</span>
          </button>
          <button type="button" class="bottom-nav__item" data-tab="lookup">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle
                cx="10"
                cy="10"
                r="6.5"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="m18.5 18.5-4-4"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <span>Lookup</span>
          </button>
          <button type="button" class="bottom-nav__item" data-tab="history">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle
                cx="11"
                cy="11"
                r="7.5"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M11 6.8V11l3 2"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
            <span>History</span>
          </button>
          <button type="button" class="bottom-nav__item" data-tab="contacts">
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle
                cx="8.5"
                cy="7.5"
                r="3"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M3.5 17c.6-2.9 2.5-4.6 5-4.6s4.4 1.7 5 4.6"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
              <path
                d="M14 8.2a2.4 2.4 0 1 1 2.8 2.4c1.6.5 2.6 1.8 3 3.7"
                stroke="currentColor"
                stroke-width="1.4"
                stroke-linecap="round"
              />
            </svg>
            <span>Contacts</span>
          </button>
          <button
            type="button"
            class="bottom-nav__item is-active"
            data-tab="profile"
          >
            <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
              <circle
                cx="11"
                cy="7.8"
                r="3.3"
                stroke="currentColor"
                stroke-width="1.5"
              />
              <path
                d="M4.6 18c1-3.2 3.6-5 6.4-5s5.4 1.8 6.4 5"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
              />
            </svg>
            <span>Profile</span>
          </button>
        </nav>
      </div>
    </div>

    <script src="profileSetting.js"></script>
  </body>
</html>
