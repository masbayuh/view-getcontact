<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Veridial — Sign in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="device-frame">
      <div class="screen" id="screen">
        <!-- mock Android status bar (decorative only) -->
        <div class="status-bar" aria-hidden="true">
          <span class="status-bar__time">9:41</span>
          <div class="status-bar__icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path
                d="M8 2.4c2.3 0 4.4.9 6 2.4l-1.4 1.5A6.6 6.6 0 0 0 8 4.6a6.6 6.6 0 0 0-4.6 1.7L2 4.8A8.6 8.6 0 0 1 8 2.4Zm0 3.4c1.3 0 2.5.5 3.4 1.4l-1.4 1.4A2.9 2.9 0 0 0 8 7.8c-.8 0-1.5.3-2 .8L4.6 7.2A4.6 4.6 0 0 1 8 5.8Zm0 3.3c.6 0 1.1.2 1.5.6L8 11.2 6.5 9.7c.4-.4.9-.6 1.5-.6Z"
                fill="currentColor"
              />
            </svg>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
              <rect
                x="1"
                y="1"
                width="14"
                height="10"
                rx="2"
                stroke="currentColor"
                stroke-width="1.1"
              />
              <rect
                x="2.3"
                y="2.3"
                width="9.4"
                height="7.4"
                rx="1"
                fill="currentColor"
              />
              <rect
                x="16"
                y="4"
                width="1.6"
                height="4"
                rx="0.6"
                fill="currentColor"
              />
            </svg>
          </div>
        </div>

        <!-- state preview strip: visual demo only, no logic -->
        <div class="state-demo" role="group" aria-label="Preview visual states">
          <button
            type="button"
            class="state-chip is-active"
            data-state="default"
          >
            Default
          </button>
          <button type="button" class="state-chip" data-state="focused">
            Focused
          </button>
          <button type="button" class="state-chip" data-state="error">
            Error
          </button>
          <button type="button" class="state-chip" data-state="disabled">
            Disabled
          </button>
          <button type="button" class="state-chip" data-state="loading">
            Loading
          </button>
        </div>

        <main class="content">
          <div class="brand">
            <svg
              class="brand__mark"
              width="56"
              height="56"
              viewBox="0 0 56 56"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true"
            >
              <rect width="56" height="56" rx="16" fill="url(#g)" />
              <path
                d="M28 15c-5.5 0-10 4.2-10 9.4 0 6.6 8.5 14.6 9.3 15.4a1 1 0 0 0 1.4 0c.8-.8 9.3-8.8 9.3-15.4 0-5.2-4.5-9.4-10-9.4Z"
                fill="white"
                fill-opacity="0.16"
              />
              <circle cx="28" cy="24" r="4.6" fill="white" />
              <defs>
                <linearGradient
                  id="g"
                  x1="0"
                  y1="0"
                  x2="56"
                  y2="56"
                  gradientUnits="userSpaceOnUse"
                >
                  <stop stop-color="#5B6EF5" />
                  <stop offset="1" stop-color="#3546C4" />
                </linearGradient>
              </defs>
            </svg>
            <h1 class="brand__name">Veridial</h1>
          </div>

          <header class="headline">
            <h2>Welcome back</h2>
            <p>Identify callers. Stay protected.</p>
          </header>

          <form class="auth-form" novalidate>
            <div class="field" id="field-identifier">
              <label for="identifier">Phone number or email</label>
              <div class="field__control">
                <svg
                  class="field__icon"
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                >
                  <path
                    d="M3 5.5A1.5 1.5 0 0 1 4.5 4h11A1.5 1.5 0 0 1 17 5.5v9a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 14.5v-9Z"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                  <path
                    d="m3.5 5.5 6.5 5 6.5-5"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                <input
                  type="text"
                  id="identifier"
                  name="identifier"
                  placeholder="you@example.com"
                  autocomplete="username"
                />
              </div>
              <p class="field__error">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <circle
                    cx="7"
                    cy="7"
                    r="6.3"
                    stroke="currentColor"
                    stroke-width="1.3"
                  />
                  <path
                    d="M7 4v3.6"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linecap="round"
                  />
                  <circle cx="7" cy="9.8" r="0.9" fill="currentColor" />
                </svg>
                We couldn't find an account with that number or email.
              </p>
            </div>

            <div class="field" id="field-password">
              <label for="password">Password</label>
              <div class="field__control">
                <svg
                  class="field__icon"
                  width="20"
                  height="20"
                  viewBox="0 0 20 20"
                  fill="none"
                >
                  <rect
                    x="4.5"
                    y="9"
                    width="11"
                    height="7.5"
                    rx="2"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                  <path
                    d="M6.8 9V6.5a3.2 3.2 0 0 1 6.4 0V9"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                </svg>
                <input
                  type="password"
                  id="password"
                  name="password"
                  placeholder="Enter your password"
                  autocomplete="current-password"
                />
                <button
                  type="button"
                  class="field__action"
                  id="togglePassword"
                  aria-label="Show password"
                  aria-pressed="false"
                >
                  <svg
                    class="icon-eye"
                    width="20"
                    height="20"
                    viewBox="0 0 20 20"
                    fill="none"
                  >
                    <path
                      d="M1.5 10s3-6 8.5-6 8.5 6 8.5 6-3 6-8.5 6-8.5-6-8.5-6Z"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                    <circle
                      cx="10"
                      cy="10"
                      r="2.6"
                      stroke="currentColor"
                      stroke-width="1.4"
                    />
                  </svg>
                  <svg
                    class="icon-eye-off"
                    width="20"
                    height="20"
                    viewBox="0 0 20 20"
                    fill="none"
                    hidden
                  >
                    <path
                      d="M2.5 2.5l15 15M8.3 8.4a2.6 2.6 0 0 0 3.4 3.4M6 5.1C3.4 6.2 1.5 9 1.5 9s3 6 8.5 6c1.4 0 2.6-.4 3.6-.9M14.3 14.3C16.2 13 18.5 10 18.5 10s-1.4-2.8-4.1-4.4"
                      stroke="currentColor"
                      stroke-width="1.4"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </div>
              <p class="field__error">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
                  <circle
                    cx="7"
                    cy="7"
                    r="6.3"
                    stroke="currentColor"
                    stroke-width="1.3"
                  />
                  <path
                    d="M7 4v3.6"
                    stroke="currentColor"
                    stroke-width="1.3"
                    stroke-linecap="round"
                  />
                  <circle cx="7" cy="9.8" r="0.9" fill="currentColor" />
                </svg>
                Incorrect password. Try again.
              </p>
            </div>

            <div class="auth-form__row">
              <label class="checkbox">
                <input type="checkbox" id="remember" name="remember" />
                <span class="checkbox__box" aria-hidden="true">
                  <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
                    <path
                      d="M1 5l3.2 3.2L11 1.4"
                      stroke="white"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </span>
                <span>Remember me</span>
              </label>
              <a href="#" class="link-muted">Forgot password?</a>
            </div>

            <button type="submit" class="btn btn--primary" id="signInBtn">
              <span class="btn__label">Sign In</span>
              <span class="btn__spinner" aria-hidden="true"></span>
            </button>

            <div class="divider"><span>OR</span></div>

            <button type="button" class="btn btn--google">
              <svg
                width="20"
                height="20"
                viewBox="0 0 18 18"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62Z"
                  fill="#4285F4"
                />
                <path
                  d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.81.54-1.85.86-3.06.86-2.35 0-4.34-1.58-5.05-3.71H.94v2.33A9 9 0 0 0 9 18Z"
                  fill="#34A853"
                />
                <path
                  d="M3.95 10.71a5.4 5.4 0 0 1 0-3.42V4.96H.94a9 9 0 0 0 0 8.08l3.01-2.33Z"
                  fill="#FBBC05"
                />
                <path
                  d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.9 11.43 0 9 0A9 9 0 0 0 .94 4.96l3.01 2.33C4.66 5.16 6.65 3.58 9 3.58Z"
                  fill="#EA4335"
                />
              </svg>
              Continue with Google
            </button>
          </form>

          <p class="footer-text">
            Don't have an account?
            <a href="#" class="link-accent">Create account</a>
          </p>
        </main>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
