<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Veridial — Phone Lookup</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="phoneLookup.css" />
  </head>
  <body>
    <div class="device-frame">
      <div class="screen" id="screen">
        <!-- mock Android status bar (decorative only) -->
        <div class="status-bar" aria-hidden="true">
          <span class="status-bar__time">9:41</span>
          <div class="status-bar__icons">
            <svg width="16" height="12" viewBox="0 0 16 12" fill="none">
              <path
                d="M8 2.4c2.3 0 4.4.9 6 2.4l-1.4 1.5A6.6 6.6 0 0 0 8 4.6a6.6 6.6 0 0 0-4.6 1.7L2 4.8A8.6 8.6 0 0 1 8 2.4Zm0 3.4c1.3 0 2.5.5 3.4 1.4l-1.4 1.4A2.9 2.9 0 0 0 8 7.8c-.8 0-1.5.3-2 .8L4.6 7.2A4.6 4.6 0 0 1 8 5.8Zm0 3.3c.6 0 1.1.2 1.5.6L8 11.2 6.5 9.7c.4-.4.9-.6 1.5-.6Z"
                fill="currentColor"
              />
            </svg>
            <svg width="18" height="12" viewBox="0 0 18 12" fill="none">
              <rect
                x="1"
                y="1"
                width="14"
                height="10"
                rx="2"
                stroke="currentColor"
                stroke-width="1.1"
              />
              <rect
                x="2.3"
                y="2.3"
                width="9.4"
                height="7.4"
                rx="1"
                fill="currentColor"
              />
              <rect
                x="16"
                y="4"
                width="1.6"
                height="4"
                rx="0.6"
                fill="currentColor"
              />
            </svg>
          </div>
        </div>

        <!-- Top app bar -->
        <header class="app-bar">
          <button
            type="button"
            class="icon-btn icon-btn--flat"
            aria-label="Back"
          >
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
              <path
                d="M12.5 4.5 6.7 10l5.8 5.5"
                stroke="currentColor"
                stroke-width="1.7"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </button>
          <h1 class="app-bar__title">Phone Lookup</h1>
          <span class="app-bar__spacer" aria-hidden="true"></span>
        </header>

        <!-- scrollable content -->
        <main class="content">
          <p class="lookup-number">+62 812 3456 7890</p>

          <div class="lookup-identity">
            <div class="lookup-avatar">BS</div>
            <h2 class="lookup-name">Budi Santoso</h2>
            <span class="tag tag--chip">Personal</span>
          </div>

          <!-- Risk indicator: prominent, color-coded -->
          <section class="risk-banner risk-banner--low" role="status">
            <div class="risk-banner__icon">
              <svg width="22" height="22" viewBox="0 0 22 22" fill="none">
                <path
                  d="M11 2.6 4.6 5v5c0 4.3 2.8 7.6 6.4 8.7 3.6-1.1 6.4-4.4 6.4-8.7V5L11 2.6Z"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linejoin="round"
                />
                <path
                  d="m7.9 11 2.1 2.1 4-4.4"
                  stroke="currentColor"
                  stroke-width="1.6"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="risk-banner__body">
              <p class="risk-banner__label">
                <span class="risk-dot" aria-hidden="true"></span>Low Risk
              </p>
              <p class="risk-banner__sub">
                This number looks safe based on community reports.
              </p>
            </div>
          </section>

          <!-- Info list -->
          <section class="info-card">
            <div class="info-row">
              <div class="info-row__label">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <circle
                    cx="9"
                    cy="9"
                    r="7"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                  <path
                    d="M6 9.2 8 11.2l4-4.4"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
                Verified
              </div>
              <span class="info-row__value info-row__value--positive">Yes</span>
            </div>
            <div class="info-row">
              <div class="info-row__label">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <rect
                    x="5.5"
                    y="2"
                    width="7"
                    height="14"
                    rx="1.6"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                  <path
                    d="M8.2 13.4h1.6"
                    stroke="currentColor"
                    stroke-width="1.4"
                    stroke-linecap="round"
                  />
                </svg>
                Line Type
              </div>
              <span class="info-row__value">Mobile</span>
            </div>
            <div class="info-row">
              <div class="info-row__label">
                <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                  <circle
                    cx="9"
                    cy="9"
                    r="7"
                    stroke="currentColor"
                    stroke-width="1.4"
                  />
                  <path
                    d="M2 9h14M9 2c1.8 1.9 2.8 4.3 2.8 7s-1 5.1-2.8 7c-1.8-1.9-2.8-4.3-2.8-7s1-5.1 2.8-7Z"
                    stroke="currentColor"
                    stroke-width="1.2"
                  />
                </svg>
                Country
              </div>
              <span class="info-row__value">Indonesia</span>
            </div>
          </section>

          <!-- Community reports -->
          <section class="reports-card">
            <div class="reports-card__icon">
              <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                <circle
                  cx="7"
                  cy="7.5"
                  r="2.6"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <circle
                  cx="14"
                  cy="8.5"
                  r="2.1"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <path
                  d="M2.5 16c.7-2.7 2.5-4.2 4.5-4.2s3.8 1.5 4.5 4.2M12.6 12.7c1.6.1 2.9 1.4 3.4 3.3"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linecap="round"
                />
              </svg>
            </div>
            <div class="reports-card__body">
              <p class="reports-card__title">Community Reports</p>
              <p class="reports-card__sub">12 reports</p>
            </div>
          </section>

          <!-- Primary actions -->
          <div class="action-stack">
            <button type="button" class="btn btn--primary">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M4.5 2.5h9a1 1 0 0 1 1 1V16l-5.5-3-5.5 3V3.5a1 1 0 0 1 1-1Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="btn__label">Save Contact</span>
              <span class="btn__spinner" aria-hidden="true"></span>
            </button>
            <button type="button" class="btn btn--danger-outline">
              <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
                <path
                  d="M4 2.5v13"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                />
                <path
                  d="M4 3h8.3c1 0 1.5 1.1.9 1.9l-1.6 2 1.6 2c.6.8.1 1.9-.9 1.9H4V3Z"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linejoin="round"
                />
              </svg>
              <span class="btn__label">Report Spam</span>
            </button>
          </div>

          <div class="action-row">
            <button type="button" class="btn btn--ghost">
              <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
                <path
                  d="M2.5 9.3 8.7 3a1.4 1.4 0 0 1 2 0l3.3 3.3a1.4 1.4 0 0 1 0 2L8 14.5H2.5V9.3Z"
                  stroke="currentColor"
                  stroke-width="1.4"
                  stroke-linejoin="round"
                />
                <circle cx="10.6" cy="6.4" r="1" fill="currentColor" />
              </svg>
              Add Tag
            </button>
            <button type="button" class="btn btn--ghost">
              <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
                <circle
                  cx="13"
                  cy="3.8"
                  r="2"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <circle
                  cx="13"
                  cy="13.2"
                  r="2"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <circle
                  cx="4"
                  cy="8.5"
                  r="2"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
                <path
                  d="m5.7 7.6 5.6-2.9M5.7 9.4l5.6 2.9"
                  stroke="currentColor"
                  stroke-width="1.4"
                />
              </svg>
              Share
            </button>
          </div>

          <div class="content-spacer"></div>
        </main>
      </div>
    </div>

    <script src="phoneLookup.js"></script>
  </body>
</html>
